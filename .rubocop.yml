inherit_mode:
  merge:
    - Exclude
plugins:
  - rubocop-rails
AllCops:
  Exclude:
    - bin/puma
    - bin/pumactl
    - bin/setup
    - bin/rainbows
    - bin/unicorn
    - bin/unicorn_rails
    - bin/update
    - bin/yarn
    - vendor/bundle/**/*
  TargetRubyVersion: 3.4
  # Cops added after this config was written stay pending: enabling them all
  # reports 97 further offenses, worth a pass of its own.
  NewCops: pending
Layout/HashAlignment:
  EnforcedHashRocketStyle: [ key, table ]
  EnforcedColonStyle: [ key, table ]
Layout/LineLength:
  Max: 200
Metrics:
  Enabled: false
Naming/AccessorMethodName:
  Exclude:
    - app/controllers/bigbluebutton_api_controller.rb
Naming/PredicatePrefix:
  Exclude:
    - app/controllers/bigbluebutton_api_controller.rb
Rails:
  Enabled: true
Rails/DynamicFindBy:
  # The models used in this code aren't actually ActiveRecord
  Enabled: false
Style/AsciiComments:
  AllowedChars: [ © ]
Style/Documentation:
  Enabled: false
Style/DoubleNegation:
  Enabled: false
Style/MethodCallWithArgsParentheses:
  Enabled: true
  AllowedMethods:
    - desc
    - gem
    - include
    - require
    - require_relative
    - ruby
    - raise
    - source
    - throw
  Exclude:
    - "**/*.xml.builder"
Style/SymbolArray:
  MinSize: 6
Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: consistent_comma
Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: consistent_comma
Style/ClassAndModuleChildren:
  Enabled: false
Rails/Date:
  Enabled: false
Rails/HelperInstanceVariable:
  # this is temporary while I refactor the code from the helper to libs/concerns
  Enabled: false
  
